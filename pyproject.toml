[tool.isort]
profile = "black"
line_length = 80

[tool.black]
line-length = 80
target-version = ["py311", "py312", "py313", "py314", "py315"]
exclude = "plugins/module_utils/documentation"

[tool.autoflake]
exclude = "plugins/module_utils/documentation"
expand-star-imports = true
ignore-init-module-imports = true
ignore-pass-after-docstring = true
in-place = true
recursive = true
remove-all-unused-imports = true
